<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Contacto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }
    form {
      background: white;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    .mensaje {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <form id="formulario">
    <h2>Contáctanos</h2>
    <input type="text" name="nombre" placeholder="Tu nombre" required>
    <input type="email" name="correo" placeholder="Tu correo" required>
    <textarea name="mensaje" rows="5" placeholder="Escribe tu mensaje..." required></textarea>
    <button type="submit">Enviar</button>
    <div class="mensaje" id="mensaje"></div>
  </form>

  <script>
    const form = document.getElementById('formulario');
    const mensajeDiv = document.getElementById('mensaje');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const data = {
        nombre: form.nombre.value,
        correo: form.correo.value,
        mensaje: form.mensaje.value
      };

      try {
        const response = await fetch('[tu URL]', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        mensajeDiv.textContent = result.message;
        mensajeDiv.style.color = result.status === "success" ? "green" : "red";
        form.reset();
      } catch (error) {
        mensajeDiv.textContent = "Error al enviar el formulario.";
        mensajeDiv.style.color = "red";
        console.error("Error:", error);
      }
    });
  </script>

</body>
</html>
